name: AutoService Mobile CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Build Signed Release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mobile-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant Gradle execution permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSERVICE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSERVICE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSERVICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSERVICE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoservice-release.jks"
          chmod 600 "$RUNNER_TEMP/autoservice-release.jks"

      - name: Build signed Release APK
        env:
          ORG_GRADLE_PROJECT_autoserviceSigningStoreFile: ${{ runner.temp }}/autoservice-release.jks
          ORG_GRADLE_PROJECT_autoserviceSigningStorePassword: ${{ secrets.AUTOSERVICE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_autoserviceSigningKeyAlias: ${{ secrets.AUTOSERVICE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_autoserviceSigningKeyPassword: ${{ secrets.AUTOSERVICE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: autoservice-mobile-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/autoservice-release.jks"